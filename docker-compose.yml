# Intelligence service — standalone infra (do NOT reuse root copyr compose).
name: copyr-intelligence

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copyr_intel
      POSTGRES_PASSWORD: intel
      POSTGRES_DB: intelligence
    ports:
      - "5434:5432"
    volumes:
      - intel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copyr_intel -d intelligence"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: copyr-intel
      MINIO_ROOT_PASSWORD: copyr-intel-secret
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - intel_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 copyr-intel copyr-intel-secret &&
      mc mb --ignore-existing local/intelligence &&
      exit 0"

volumes:
  intel_pgdata:
  intel_miniodata:
